<div class="add-trip-form">
  <h2>Add New Trip</h2>
  <div class="form-group">
    <label for="name">Trip Name</label>
    <input type="text" id="name" [(ngModel)]="name" placeholder="Enter trip name">
  </div>
  <div class="form-group">
    <label for="destination">Destination</label>
    <input type="text" id="destination" [(ngModel)]="destination" placeholder="Enter destination">
  </div>
  <div class="form-group">
    <label for="startDate">Start Date</label>
    <input type="date" id="startDate" [(ngModel)]="startDate">
  </div>
  <div class="form-group">
    <label for="endDate">End Date</label>
    <input type="date" id="endDate" [(ngModel)]="endDate">
  </div>
  <div class="form-group">
    <label for="price">Price</label>
    <input type="number" id="price" [(ngModel)]="price" placeholder="Enter price">
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" [(ngModel)]="description" placeholder="Enter trip description"></textarea>
  </div>
  <div class="form-group">
    <label for="image">Image URL</label>
    <input type="text" id="image" [(ngModel)]="image" placeholder="Enter image URL">
  </div>
  @if(errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }
  <div class="form-actions">
    <button class="submit-btn" (click)="addOrEditTrip()">Add Trip</button>
    <button class="cancel-btn" (click)="cancel()">Cancel</button>
  </div>
</div>
